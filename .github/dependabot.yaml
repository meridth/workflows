version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      timezone: 'America/Chicago'
    # Wait a week before proposing new action versions, so a compromised
    # release is likely caught before it reaches every caller.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      dependencies:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
