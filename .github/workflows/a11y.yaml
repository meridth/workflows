name: Accessibility

# Reusable: serves a built static site from an artifact and scans it with
# pa11y-ci. Pair it with a build job in the same run; see README.md.
on:
  workflow_call:
    inputs:
      artifact:
        description: Name of the artifact holding the built site, uploaded earlier in the same run.
        type: string
        required: true
      pa11y-config:
        description: Path to the pa11y-ci config, relative to the repo root.
        type: string
        default: .pa11yci.js
      node-version:
        description: Node.js version for pa11y-ci.
        type: string
        default: "24"
      port:
        description: Local port to serve the site on. pa11y-ci gets the full address as SITE_URL.
        type: number
        default: 4173

permissions: {}

env:
  # The site is served here. pa11y configs can read SITE_URL instead of
  # hardcoding the address.
  PORT: ${{ inputs.port }}
  SITE_URL: http://localhost:${{ inputs.port }}/

jobs:
  pa11y:
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Clone the repository for package.json and the pa11y config
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: public

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      # pa11y uses the runner's preinstalled Chrome, so skip Puppeteer's download.
      - name: Install pa11y-ci and serve
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Serve site
        run: |
          npx --no-install serve public -l "$PORT" --no-clipboard > /dev/null 2>&1 &
          for _ in $(seq 30); do curl -sf -o /dev/null "$SITE_URL" && exit 0; sleep 1; done
          echo "Static server did not start" >&2
          exit 1

      - name: Run pa11y-ci
        run: npx --no-install pa11y-ci --config "$PA11Y_CONFIG"
        env:
          PA11Y_CONFIG: ${{ inputs.pa11y-config }}
          CHROME_PATH: /usr/bin/google-chrome
