name: Auto Labeler

on:
  # pull_request_target so fork PRs get labeled too. Safe here: the
  # autolabeler reads PR titles and the config, never the PR's code.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, edited, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-labeler:
    permissions:
      contents: read # Read the release-drafter config
      pull-requests: write # Apply labels to the pull request
      issues: write # Create labels referenced in the config but missing from the repo
    uses: github-community-projects/ospo-reusable-workflows/.github/workflows/auto-labeler.yaml@a48c75fafbf2513929ff2ce06dfaa38247ddc50b # v2.1.0
    with:
      config-name: release-drafter.yml
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
