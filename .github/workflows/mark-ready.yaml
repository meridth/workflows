name: Mark ready when ready

# Reusable: marks a draft PR ready for review once its checks pass, if it has
# the trigger label. Call it from a workflow on `pull_request`; see README.md.
on:
  workflow_call:
    inputs:
      label:
        description: Label that opts a draft PR in. The action removes it after marking the PR ready.
        type: string
        default: mark-ready-when-ready

permissions: {}

jobs:
  mark-ready:
    name: Mark as ready after successful checks
    runs-on: ubuntu-24.04
    permissions:
      checks: read # Poll check runs to know when they pass
      contents: write # Required by mark-ready-when-ready to flip the PR out of draft
      pull-requests: write # Mark the PR ready for review
      statuses: read # Poll commit statuses alongside check runs
    # Fork PRs get a read-only token, so they can't be marked ready anyway.
    if: |
      contains(github.event.pull_request.labels.*.name, inputs.label) &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Mark ready when ready
        uses: kenyonj/mark-ready-when-ready@164bebf98862a24419165413a00bab80107b25ad # v1.3.0
        with:
          github-token: ${{ github.token }}
          label: ${{ inputs.label }}
